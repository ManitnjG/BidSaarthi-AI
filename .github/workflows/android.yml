name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BidSaarthi-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish rolling APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "BidSaarthi AI Build ${{ github.run_number }}" --notes "Automated Android debug build."
  collect-real-tenders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Collect official public tender listings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio,json,sys
          sys.path.insert(0,"backend")
          from app.collector import collect_all
          async def run():
              results=await collect_all()
              rows=[]
              status=[]
              for r in results:
                  status.append({"source":r["source"],"status":r["status"],"count":len(r["items"]),"error":r.get("error")})
                  rows += [x.model_dump() for x in r["items"]]
              with open("app/src/main/assets/tenders.json","w") as f: json.dump(rows,f,ensure_ascii=False)
              with open("app/src/main/assets/source_status.json","w") as f: json.dump(status,f,ensure_ascii=False)
              print(status)
              if not rows: raise SystemExit("No real tender listings collected")
          asyncio.run(run())
          PY
      - name: Commit refreshed tender data
        run: |
          git config user.name "BidSaarthi Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/tenders.json app/src/main/assets/source_status.json
          git diff --cached --quiet || git commit -m "data: refresh official tender listings [skip ci]"
          git push
