name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        env:
          BIDSAARTHI_BACKEND_URL: https://bidsaarthi-ai.onrender.com
        run: gradle --no-daemon --no-build-cache clean :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BidSaarthi-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish rolling APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "BidSaarthi AI Build ${{ github.run_number }}" --notes "Automated Android debug build."

  collect-real-tenders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Collect official public tender listings
        timeout-minutes: 15
        run: PYTHONPATH=backend python backend/scripts/collect_snapshot.py
      - name: Commit refreshed tender data
        run: |
          git config user.name "BidSaarthi Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/tenders.json app/src/main/assets/source_status.json app/src/main/assets/collection_cursors.json app/src/main/assets/sources.json
          git diff --cached --quiet || git commit -m "data: refresh official tender listings [skip ci]"
          git pull --rebase origin main
          git push
